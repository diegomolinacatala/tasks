name = "tasks-push"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

# Los avisos los dispara la alarma del Durable Object a su hora exacta.
[[durable_objects.bindings]]
name = "SCHEDULER"
class_name = "Scheduler"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Scheduler"]

# Red de seguridad: cada 5 minutos vuelve a armar la alarma si hubiera pendientes.
[triggers]
crons = ["*/5 * * * *"]

[vars]
# capacitor://localhost es el origen de la app de iPhone.
ALLOWED_ORIGINS = "https://diegomolinacatala.github.io,capacitor://localhost,http://localhost:5173,http://localhost:4173"

[[d1_databases]]
binding = "DB"
database_name = "tasks-push"
# Se rellena con el id que devuelve `npx wrangler d1 create tasks-push`. No es secreto.
database_id = "5d84c340-7a7a-49ab-8e1b-30873228f89f"

# Límites nativos de Cloudflare (namespace_id: entero libre, único por cuenta).
[[ratelimits]]
name = "IP_LIMITER"
namespace_id = "7301"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "DEVICE_LIMITER"
namespace_id = "7302"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "VOICE_LIMITER"
namespace_id = "7304"
simple = { limit = 10, period = 60 }

# Estadísticas: un móvil manda un lote al pasar a segundo plano. Holgado para varios tras la misma IP
# (las redes móviles comparten IP); lo que de verdad protege D1 es el presupuesto diario de escrituras.
[[ratelimits]]
name = "STATS_LIMITER"
namespace_id = "7305"
simple = { limit = 6, period = 60 }

# El panel de uso (/uso): página, código y capturas de referencia. El Worker va primero para ponerle
# su política de seguridad (index.ts); lo demás sigue siendo la API de siempre.
[assets]
directory = "./panel"
binding = "ASSETS"
run_worker_first = true

# Dictado: Whisper en Workers AI (plan gratuito, sin claves).
[ai]
binding = "AI"

[observability]
enabled = true

# Secrets (nunca en el repo): VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT, IP_HASH_SALT
# y FEEDBACK_KEY (la clave del buzón de sugerencias, /buzon; sin ella el buzón no se abre)
